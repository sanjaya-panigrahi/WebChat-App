server:
  port: 8080

topic:
  name: topic-web-chat-app

spring:
  application:
    name: CHAT-APP

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/webchat-app-db
    username: root
    password: secret
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  kafka:
    bootstrap-servers: "localhost:9092"
    producer:
      keySerializer: "org.apache.kafka.common.serialization.StringSerializer"
      valueSerializer: "com.webchat.chatapp.chat_service.producer.ChatMessageSerializer"

    consumer:
      group-id: "topic-web-chat-app-grp"
      keyDeserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      valueDeserializer: "com.webchat.chatapp.chat_service.consumer.ChatMessageDeserializer"
      autoOffsetReset: "earliest"

eureka:
  client:
    service_url:
      default_zone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure.include: health, info
  endpoint:
    health:
      show-details: always

springdoc:
  show-actuator: true
  swagger-ui:
    groups-order: DESC
    disable-swagger-default-url: true