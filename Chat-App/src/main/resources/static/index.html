<!DOCTYPE html>
<html lang="en">

<head>
    <title>Chat Application</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/main.css" rel="stylesheet" />

</head>
<body>

<h2>Chat Application</h2>

<div class="user-chat-login-container">
    <div class="user-form" id="username-page">
        <h2>Enter Chatroom</h2>
        <form id="usernameForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Enter Chatroom</button>
        </form>
    </div>
<!--    <div class="user-form" id="login-msg-page">-->
<!--        <h2>Login Failed</h2>-->
<!--    </div>-->
</div>

<div class="user-chat-container">
    <div class="chat-container hidden" id="chat-page">
        <div class="users-list">
            <div class="users-list-container">
                <h2>Online Users</h2>
                <ul id="connectedUsers">
                </ul>
            </div>
            <div>
                <p id="connected-user-fullname"></p>
                <a class="logout" href="javascript:void(0)" id="logout">Logout</a>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-area" id="chat-messages">
            </div>

            <form id="messageForm" name="messageForm" class="hidden">
                <div class="message-input">
                    <input autocomplete="off" type="text" id="message" placeholder="Type your message...">
                    <button>Send</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/sockjs.min.js" type="application/javascript"></script>
<script src="/stomp.min.js" type="application/javascript"></script>
<script src="/main.js" type="application/javascript"></script>
</body>
</html>
